# Builds the website and publishes it on acharyafoods.com.np.
#
# Works with either GitHub Pages setting (Settings -> Pages -> Source):
# - "GitHub Actions" (the setting in use): the built site is deployed by the last job.
# - "Deploy from a branch: main / root": the finished pages are also kept at the top of main.
# The source lives in site/. It runs whenever anything in site/
# changes - including when the business system publishes new content
# (site/content/site.json and site/content/media/).
name: Publish website

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish-website
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build
        working-directory: site
        run: |
          npm ci
          npm run build
      - name: Put the finished pages at the top of main
        run: node site/scripts/place-build.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The published pages are already up to date."
          else
            git commit -m "Publish website build"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
